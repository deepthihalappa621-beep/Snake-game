<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="snake-bg"></div>
  <div class="login-box">
    <h1>🐍 Snake Game</h1>
    <p class="subtitle">Login to Play</p>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">▶ Play Now</button>
    <p id="error-msg"></p>
  </div>
  <script>
    function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u === 'deepthi' && p === 'deepu@2006') {
        window.location.href = 'game.html';
      } else {
        document.getElementById('error-msg').textContent = '❌ Wrong credentials!';
      }
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
